name: Pravidla / nastroje

on:
  push:
  pull_request:

# Token nesmi vic, nez je potreba ke cteni repozitare. Volany workflow
# zije v Terms4Ever/nastroje a odkazuje se na nej vetvi, ne otiskem,
# zamerne, aby se pravidla menila na jednom miste. Tohle omezeni je
# pojistka pro pripad, ze by se ta vetev zmenila.
permissions:
  contents: read
  issues: read

jobs:
  readme:
    uses: Terms4Ever/nastroje/.github/workflows/readme.yml@main

  # Jest testy (tests/*.test.ts). Do 23. 9. 2026 existovaly, ale v CI
  # neběžely, takže rozbitý výpočet by si nikdo nevšiml (audit, S26).
  testy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testy
        run: npm test
