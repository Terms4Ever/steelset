<!doctype html>
<!--
  Obrazovky aplikace pro Apple Watch pro snímky do App Storu. Z Windows nejde hodinky spustit,
  proto jsou překreslené podle targets/watch/Views.swift: stejné texty, barvy, velikosti písma
  (pt = CSS px) a rozložení. Při změně Views.swift upravit i tady.
  ?screen=metrics|rest|summary&lang=cs|en
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=211, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --green: rgb(0, 224, 122); --heart: rgb(255, 55, 95); --energy: rgb(255, 159, 10); --gray: #8e8e93; }
  html, body { margin: 0; width: 211px; height: 257px; background: #000; color: #fff; overflow: hidden; }
  body { font-family: Inter, -apple-system, sans-serif; position: relative; }
  .bar { position: absolute; top: 14px; left: 24px; right: 22px; display: flex; justify-content: space-between; align-items: baseline; }
  .title { font-size: 15px; font-weight: 600; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px; }
  .clock { flex: none; }
  .clock { font-size: 15px; font-weight: 600; }
  .content { position: absolute; top: 44px; left: 18px; right: 18px; }
  .rounded { font-family: Nunito, sans-serif; font-variant-numeric: tabular-nums; }
  .big { font-size: 38px; font-weight: 800; color: var(--green); line-height: 1.05; letter-spacing: -0.5px; }
  .row { display: flex; align-items: baseline; gap: 4px; line-height: 1.12; }
  .row .v { font-size: 26px; font-weight: 700; }
  .row .u { font-size: 13px; font-weight: 700; }
  .heart { width: 17px; height: 15px; align-self: center; }
  .dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: #555; }
  .dots i.on { background: #fff; }
  .ring { position: relative; width: 110px; height: 110px; margin: 0 auto; }
  .ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; }
  .center { text-align: center; }
  .small { font-size: 13px; font-weight: 600; color: var(--gray); }
  .btn { margin-top: 8px; background: #2c2c2e; border-radius: 22px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="bar"><span class="title" id="title"></span><span class="clock">10:09</span></div>
<div class="content" id="content"></div>
<div class="dots" id="dots"></div>
<script>
  const q = new URLSearchParams(location.search);
  const screen = q.get('screen') || 'metrics';
  const en = q.get('lang') === 'en';
  const L = (cs, e) => (en ? e : cs);
  const heart = '<svg class="heart" viewBox="0 0 24 21"><path fill="rgb(255,55,95)" d="M12 21s-9.5-6.1-11.6-11.3C-1.2 5.6 1.6 1 6 1c2.6 0 4.6 1.5 6 3.6C13.4 2.5 15.4 1 18 1c4.4 0 7.2 4.6 5.6 8.7C21.5 14.9 12 21 12 21z"/></svg>';
  const row = (h, v, u, c) => `<div class="row">${h ? heart : ''}<span class="v rounded">${v}</span><span class="u" style="color:${c}">${u}</span></div>`;
  const title = document.getElementById('title');
  const content = document.getElementById('content');
  const dots = document.getElementById('dots');
  const pager = (on) => (dots.innerHTML = [0, 1, 2].map((i) => `<i class="${i === on ? 'on' : ''}"></i>`).join(''));

  if (screen === 'metrics') {
    title.textContent = L('Silový trénink', 'Strength training');
    content.innerHTML =
      `<div class="big rounded">${L('42:15,37', '42:15.37')}</div>` +
      row(true, '138', 'BPM', 'var(--heart)') +
      row(false, '286', 'KCAL', 'var(--energy)') +
      row(false, 'Ø 127', 'BPM', 'var(--gray)');
    pager(1);
  } else if (screen === 'rest') {
    title.textContent = L('Odpočinek', 'Rest');
    const r = 46, c = 2 * Math.PI * r, progress = 0.62;
    content.style.top = '40px';
    content.innerHTML =
      `<div class="ring"><svg width="110" height="110" viewBox="0 0 110 110">` +
      `<circle cx="55" cy="55" r="${r}" fill="none" stroke="rgba(0,224,122,0.25)" stroke-width="9"/>` +
      `<circle cx="55" cy="55" r="${r}" fill="none" stroke="rgb(0,224,122)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c * progress} ${c}" transform="rotate(-90 55 55)"/>` +
      `</svg><span class="rounded">1:24</span></div>` +
      `<div class="center small" style="margin-top:4px">${L('Další: Bench press 3/4', 'Next: Bench press 3/4')}</div>` +
      `<div class="center" style="margin-top:4px; display:flex; justify-content:center; align-items:center; gap:4px">${heart}<span style="font-size:15px;font-weight:600">112 BPM</span></div>`;
    pager(2);
  } else {
    title.textContent = L('Hotovo', 'Done');
    content.innerHTML =
      `<div style="font-size:15px;font-weight:700">Push</div>` +
      `<div class="rounded" style="font-size:26px;font-weight:700;color:var(--green);line-height:1.1">58:42</div>` +
      row(true, '131', 'Ø BPM', 'var(--heart)') +
      row(false, '412', 'KCAL', 'var(--energy)') +
      `<div class="small" style="margin-top:4px">${L('Uloženo do Zdraví', 'Saved to Health')}</div>` +
      `<div class="btn">${L('Hotovo', 'Done')}</div>`;
  }
  document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
